
name: AuroraGram Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/android-build.yml'
      - 'TMessagesProj/**'
      - 'TMessagesProj_App/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'run'
      - 'bin/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc g++ golang make cmake ninja-build yasm \
            pkg-config python3

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android components
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.18.1" \
            "cmake;3.22.1"

      - name: Configure local properties
        env:
          APP_ID: ${{ secrets.TELEGRAM_APP_ID }}
          APP_HASH: ${{ secrets.TELEGRAM_APP_HASH }}
        run: |
          test -n "$APP_ID" || {
            echo "Missing TELEGRAM_APP_ID secret"
            exit 1
          }
          test -n "$APP_HASH" || {
            echo "Missing TELEGRAM_APP_HASH secret"
            exit 1
          }
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "ndk.dir=$ANDROID_HOME/ndk/27.2.12479018"
            echo "TELEGRAM_APP_ID=$APP_ID"
            echo "TELEGRAM_APP_HASH=$APP_HASH"
          } > local.properties

      - name: Prepare native dependencies
        run: ./run init libs

      - name: Build native libraries
        run: ./run libs native

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AuroraGram-debug
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error
          retention-days: 7
