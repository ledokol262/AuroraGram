name: AuroraGram Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc g++ golang make cmake ninja-build yasm \
            pkg-config python3

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | sort | tail -n 1)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "::error::Could not find sdkmanager in the runner's Android SDK."
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "Using SDK manager at: $SDKMANAGER"

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | "$SDKMANAGER" --licenses || true

      - name: Install Android components
        shell: bash
        run: |
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.18.1" \
            "cmake;3.22.1"

      - name: Configure local properties
        env:
          APP_ID: ${{ secrets.TELEGRAM_APP_ID }}
          APP_HASH: ${{ secrets.TELEGRAM_APP_HASH }}
        shell: bash
        run: |
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "ndk.dir=$ANDROID_HOME/ndk/27.2.12479018"
          } > local.properties

          if [[ -n "$APP_ID" && -n "$APP_HASH" ]]; then
            {
              echo "TELEGRAM_APP_ID=$APP_ID"
              echo "TELEGRAM_APP_HASH=$APP_HASH"
            } >> local.properties
            echo "Using the repository's configured Telegram API credentials from Actions secrets."
          elif [[ -z "$APP_ID" && -z "$APP_HASH" ]]; then
            echo "::warning::Telegram API secrets are not configured; the build will use the fallback values already present in the source."
          else
            echo "::error::Set both TELEGRAM_APP_ID and TELEGRAM_APP_HASH secrets, or leave both unset."
            exit 1
          fi

      - name: Prepare native dependencies
        run: ./run init libs

      - name: Build native libraries
        run: ./run libs native

      - name: Build debug APK
        run: ./gradlew --no-daemon :TMessagesProj:assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AuroraGram-debug
          path: TMessagesProj/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
